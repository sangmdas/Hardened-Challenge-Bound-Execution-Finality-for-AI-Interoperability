[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "das-ai-interoperability-finality-hardened"
version = "0.2.0"
description = "Hardened reference implementation of challenge-bound execution finality for AI assistant interoperability"
readme = "README.md"
authors = [{name = "Sangam Kumar Das"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]
